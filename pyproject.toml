[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taste"
version = "0.1.0"
description = "Agent OS: a git-native harness for long-running agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zanwen Fu" }]
keywords = ["agents", "llm", "orchestration", "harness", "agent-os"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Upper bounds are not caution, they are a correctness requirement. With
# `anthropic>=0.40.0` alone, a fresh machine installed 1.0.0 -- a major
# version that removed `temperature` from Messages.create() -- and every
# planner call died with a TypeError while the laptop that developed this ran
# 0.96.0 and was fine. Two machines, different code, and which numbers you get
# depends on the day you ran `pip install`. See requirements-lock.txt for the
# exact stack the reported results were produced on.
dependencies = [
    "anthropic>=0.90,<1.0",
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "gitpython>=3.1.43,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=3.0,<4"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
taste = "taste.cli:main"

[project.urls]
Blog = "https://zanwenfu.com/blog/agent_harness_blog"
Repository = "https://github.com/zanwenfu/taste-is-all-you-need"

[tool.setuptools.packages.find]
include = ["taste*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Runnable scripts that adjust sys.path before importing taste, so they work
# both via `python <path>` and `python -m ...`.
"examples/refactor_demo/simulate.py" = ["E402", "I001"]
"scripts/*.py" = ["E402"]
# Vendored verbatim from the SWE-bench harness so the regexes stay diffable
# against upstream. Auditability is the entire point of these files, and a
# reformat that "modernises" an import or collapses a multi-line condition
# destroys the line-for-line correspondence a reviewer needs to check them.
"taste/benchmarks/swebench_log.py" = ["UP", "SIM", "B", "RUF", "E"]
"taste/benchmarks/swebench_specs.py" = ["UP", "SIM", "B", "RUF", "E"]
# Paper tooling: a one-file markdown-to-LaTeX converter, deliberately
# written as dense string surgery. Not library code; not held to its style.
"paper/latex/*.py" = ["E", "SIM", "B", "RUF", "UP", "C4", "PLR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
