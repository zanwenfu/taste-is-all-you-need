[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taste"
version = "0.2.0"
description = "An operating system for AI agents: a central planner, worker processes, observe-only monitors, and git as the memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Zanwen Fu" }]
keywords = ["agents", "llm", "orchestration", "harness", "agent-os"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Upper bounds are not caution, they are a correctness requirement. With
# `anthropic>=0.40.0` alone, a fresh machine installed 1.0.0 -- a major
# version that removed `temperature` from Messages.create() -- and every
# planner call died with a TypeError while the laptop that developed this ran
# 0.96.0 and was fine. Two machines, different code, and which numbers you get
# depends on the day you ran `pip install`. requirements-brains-lock.txt records
# the current Linux regression stack; requirements-lock.txt preserves the older
# legacy experiment environment for historical reproducibility.
dependencies = [
    "anthropic>=0.90,<1.0",
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "gitpython>=3.1.43,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=3.0,<4"]
# The brain layer only. Kept optional so the memory layer stays importable
# without it -- tests/test_package_isolation.py holds that boundary.
brains = ["claude-agent-sdk==0.2.152"]
# What hosted agents' own modules import (taste.agents). The agents themselves
# are installed without dependencies from requirements-agents.txt.
agents = ["jinja2>=3.1,<4", "platformdirs>=4,<5", "pyyaml>=6,<7"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # mini-swe-agent's own model class, run beside Taste's in a comparison test.
    "tenacity>=8,<10",
]
# Everything the multi-process runtime can use: both worker harnesses.
all = ["openai>=3.0,<4", "claude-agent-sdk==0.2.152"]

[project.scripts]
taste = "taste.cli:main"

[project.urls]
Repository = "https://github.com/zanwenfu/taste-is-all-you-need"
Documentation = "https://github.com/zanwenfu/taste-is-all-you-need/blob/main/docs/architecture.md"
Issues = "https://github.com/zanwenfu/taste-is-all-you-need/issues"
Changelog = "https://github.com/zanwenfu/taste-is-all-you-need/blob/main/CHANGELOG.md"
Blog = "https://zanwenfu.com/blog/agent_harness_blog"

[tool.setuptools]
# Ship the licence, the notice and the licence of the vendored code with it.
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]

[tool.setuptools.packages.find]
include = ["taste*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Runnable scripts that adjust sys.path before importing taste, so they work
# both via `python <path>` and `python -m ...`.
"examples/refactor_demo/simulate.py" = ["E402", "I001"]
"scripts/*.py" = ["E402"]
# Vendored verbatim from the SWE-bench harness so the regexes stay diffable
# against upstream. Auditability is the entire point of these files, and a
# reformat that "modernises" an import or collapses a multi-line condition
# destroys the line-for-line correspondence a reviewer needs to check them.
"taste/benchmarks/swebench_log.py" = ["UP", "SIM", "B", "RUF", "E"]
"taste/benchmarks/swebench_specs.py" = ["UP", "SIM", "B", "RUF", "E"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
