name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure git (for Memory tests)
        run: |
          git config --global user.email "ci@taste.local"
          git config --global user.name  "taste CI"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check taste/ tests/ examples/

      - name: Test
        run: pytest -v

      - name: Hermetic demo smoke
        run: python examples/refactor_demo/simulate.py
