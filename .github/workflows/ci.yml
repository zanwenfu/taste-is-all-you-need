name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-brains-lock.txt
            requirements-openai-lock.txt
            requirements-agents.txt

      - name: Configure git (for Memory tests)
        run: |
          git config --global user.email "ci@taste.local"
          git config --global user.name  "taste CI"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ '${{ matrix.python-version }}' = '3.14' ]; then
            python -m pip install -r requirements-openai-lock.txt -e '.[dev,brains,openai,agents]'
          else
            python -m pip install -e '.[dev,brains,openai,agents]'
          fi
          python -m pip check
          # Hosted agents are installed without their own dependencies, after
          # the check, which would list those as missing (requirements-agents.txt).
          python -m pip install --no-deps --require-hashes -r requirements-agents.txt

      - name: Lint
        run: ruff check taste/ tests/ examples/

      - name: Test
        run: pytest -v

      - name: Hermetic demo smoke
        run: python examples/refactor_demo/simulate.py
